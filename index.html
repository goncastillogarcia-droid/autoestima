<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de tu autoestima</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column, one screen at a time (intro → 10 questions → map), same look as the class deck */
:root {
  --bg: #F7F3EC;
  --surface: #FFFDF8;
  --line: #E2D9CA;
  --ink: #1F2A44;
  --muted: #5A6272;
  --accent: #E07A4F;
  --accent-ink: #B4532A;
  --btn: #1F2A44;
  --btn-ink: #F7F3EC;
  --q-segura: #1F2A44;
  --q-segura-ink: #F7F3EC;
  --q-fragil: #DCE6F2;
  --q-resig: #EDE6DA;
  --q-vuln: #F2DED3;
  --q-ink: #1F2A44;
  --dot-ring: #FFFDF8;
  --display: 'Domine', Georgia, serif;
  --body: 'Nunito Sans', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141B2D; --surface: #1C2540; --line: #2E3A5C; --ink: #EEE8DD; --muted: #A9B2C6;
    --accent: #E8875E; --accent-ink: #F09A72; --btn: #E8875E; --btn-ink: #141B2D;
    --q-segura: #EEE8DD; --q-segura-ink: #1F2A44; --q-fragil: #22355A; --q-resig: #2A3142; --q-vuln: #43302C;
    --q-ink: #EEE8DD; --dot-ring: #141B2D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141B2D; --surface: #1C2540; --line: #2E3A5C; --ink: #EEE8DD; --muted: #A9B2C6;
  --accent: #E8875E; --accent-ink: #F09A72; --btn: #E8875E; --btn-ink: #141B2D;
  --q-segura: #EEE8DD; --q-segura-ink: #1F2A44; --q-fragil: #22355A; --q-resig: #2A3142; --q-vuln: #43302C;
  --q-ink: #EEE8DD; --dot-ring: #141B2D; color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 8vw, 40px); }
h2 { font-size: clamp(24px, 6.4vw, 30px); }
p { margin: 0; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.btn {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 17px;
  background: var(--btn); color: var(--btn-ink); padding: 16px 22px; border-radius: 14px; width: 100%;
}
.btn:focus-visible, .opt:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.link { appearance: none; background: none; border: 0; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; padding: 8px 0; }
.link:disabled { visibility: hidden; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }

/* progress */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count { font-size: 14px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s ease; }

/* question */
.qtext { font-family: var(--display); font-size: clamp(22px, 6vw, 28px); font-weight: 500; line-height: 1.3; text-wrap: pretty; min-height: 4.2em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  appearance: none; font: inherit; font-size: 17px; font-weight: 700; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 15px 18px;
  transition: border-color .15s, background .15s;
}
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.six { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.six .opt { text-align: center; padding: 16px 0; font-size: 20px; font-variant-numeric: tabular-nums; }
.ends { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; font-weight: 700; color: var(--muted); }
.ends span:last-child { text-align: right; }

/* matrix */
.matrix { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto 1fr; gap: 8px; }
.colhead { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-weight: 800; font-size: 15px; text-align: center; }
.rowhead { display: grid; grid-template-rows: 1fr 1fr; gap: 8px; font-weight: 800; font-size: 15px; }
.rowhead span { display: flex; align-items: center; }
.plane { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; aspect-ratio: 1 / 1; max-width: 100%; }
.cell { border-radius: 14px; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; font-weight: 800; font-size: 15px; color: var(--q-ink); transition: opacity .4s; }
.cell small { display: block; font-weight: 600; font-size: 12px; opacity: .8; }
.c-segura { background: var(--q-segura); color: var(--q-segura-ink); }
.c-fragil { background: var(--q-fragil); }
.c-resignada { background: var(--q-resig); }
.c-vulnerable { background: var(--q-vuln); }
.plane.has-dot .cell:not(.on) { opacity: .45; }
.dot {
  position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
  background: var(--accent); border: 4px solid var(--dot-ring); box-shadow: 0 0 0 2px var(--accent), 0 6px 16px rgba(0,0,0,.25);
  animation: drop .6s cubic-bezier(.2,1.4,.4,1) both;
}
.dot::after { content: "Tú"; position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-weight: 800; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
@keyframes drop { from { transform: scale(0); } to { transform: scale(1); } }
.axisnote { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-weight: 700; padding-left: 60px; }

.result { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.result ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.score b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; font-weight: 700; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
(function () {
  // R = Rosenberg (nivel, 1–4). S = SESS de Altmann y Roth (estabilidad, 1–6). rev = se puntúa al revés.
  var Q = [
    { t: "Siento que soy una persona digna de aprecio, al menos tanto como los demás.", s: "R", rev: false },
    { t: "Siento que no tengo mucho de lo que estar orgulloso/a.", s: "R", rev: true },
    { t: "Creo que tengo varias cualidades buenas.", s: "R", rev: false },
    { t: "En general, tiendo a pensar que soy un fracaso.", s: "R", rev: true },
    { t: "Soy capaz de hacer las cosas tan bien como la mayoría de la gente.", s: "R", rev: false },
    { t: "Hay veces que realmente pienso que soy un inútil.", s: "R", rev: true },
    { t: "Me gustaría poder sentir más respeto por mí mismo/a.", s: "R", rev: true },
    { t: "En general, estoy satisfecho/a conmigo mismo/a.", s: "R", rev: false },
    { t: "A veces creo que no soy buena persona.", s: "R", rev: true },
    { t: "Tengo una actitud positiva hacia mí mismo/a.", s: "R", rev: false },
    { t: "Mi actitud hacia mí mismo/a es muy estable.", s: "S", rev: false },
    { t: "Cómo valoro mis capacidades en comparación con los demás cambia a menudo.", s: "S", rev: true },
    { t: "Mis sentimientos positivos y negativos hacia mí mismo/a se mezclan a menudo.", s: "S", rev: true }
  ];
  var R_OPTS = ["Muy en desacuerdo", "En desacuerdo", "De acuerdo", "Muy de acuerdo"];

  var QUAD = {
    segura: { name: "Segura", sub: "Alta y estable", desc: "Te valoras y no dependes de la aprobación de los demás.",
      acts: ["Reconoce cada día un logro de alguien", "Ofrécete a ayudar a quien lo necesite", "Ponte un reto nuevo cada mes"] },
    fragil: { name: "Frágil", sub: "Alta pero inestable", desc: "Te valoras, pero una crítica o un fallo te pueden tambalear.",
      acts: ["Tras un fallo, pregunta qué aprendes", "Pide feedback y escucha sin defenderte", "Valora el esfuerzo, no solo la nota"] },
    resignada: { name: "Resignada", sub: "Baja y estable", desc: "Te juzgas con dureza de forma constante y casi no lo cuestionas.",
      acts: ["Apunta 3 cosas que hiciste bien hoy", "Cambia «no puedo» por «aún no sé»", "Cumple un reto pequeño cada semana"] },
    vulnerable: { name: "Vulnerable", sub: "Baja e inestable", desc: "Te juzgas con dureza y tu valoración depende mucho de lo que pasa fuera.",
      acts: ["Deja de seguir cuentas que te hunden", "Escribe 5 cualidades tuyas y reléelas", "Pasa más tiempo con gente que suma"] }
  };

  var app = document.getElementById("app");
  var answers = [];
  var step = -1; // -1 intro, 0..9 preguntas, 10 resultado
  var lock = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function intro() {
    app.innerHTML =
      '<p class="eyebrow">Habilidades Personales · Dinámica 1</p>' +
      '<h1>¿Dónde está tu autoestima?</h1>' +
      '<p>Responde a 13 frases pensando en cómo te sientes normalmente. No hay respuestas buenas ni malas. Al terminar verás tu punto en la matriz.</p>' +
      '<div class="facts"><span class="fact">13 frases</span><span class="fact">Unos 3 minutos</span><span class="fact">Anónimo: no se guarda nada</span></div>' +
      '<button class="btn" id="start">Empezar</button>' +
      '<p class="small muted">Basado en la escala de Rosenberg (1965) para el nivel y la SESS de Altmann y Roth (2018) para la estabilidad. Es orientativo, no un diagnóstico.</p>';
    document.getElementById("start").onclick = function () { step = 0; render(); };
  }

  function question(i) {
    var q = Q[i], sel = answers[i];
    var opts;
    if (q.s === "R") {
      opts = '<div class="opts" role="group" aria-label="Tu respuesta">' + R_OPTS.map(function (label, k) {
        return '<button class="opt" data-v="' + (k + 1) + '" aria-pressed="' + (sel === k + 1) + '">' + label + '</button>';
      }).join("") + '</div>';
    } else {
      var nums = [1, 2, 3, 4, 5, 6].map(function (v) {
        return '<button class="opt" data-v="' + v + '" aria-pressed="' + (sel === v) + '" aria-label="' + v + ' de 6">' + v + '</button>';
      }).join("");
      opts = '<div class="opts"><div class="six" role="group" aria-label="Tu respuesta del 1 al 6">' + nums + '</div>' +
        '<div class="ends"><span>1 · No me describe</span><span>6 · Me describe totalmente</span></div></div>';
    }
    app.innerHTML =
      '<div class="top"><button class="link" id="back"' + (i === 0 ? " disabled" : "") + '>← Anterior</button>' +
      '<span class="count">' + (i + 1) + ' / ' + Q.length + '</span></div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + (i / Q.length * 100) + '%"></i></div>' +
      '<p class="qtext">' + esc(q.t) + '</p>' + opts;
    document.getElementById("back").onclick = function () { if (step > 0) { step--; render(); } };
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.onclick = function () {
        if (lock) return;
        lock = true;
        answers[i] = +b.dataset.v;
        Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-pressed", o === b); });
        app.querySelector(".bar > i").style.width = ((i + 1) / Q.length * 100) + "%";
        setTimeout(function () { lock = false; step = i + 1; render(); }, 260);
      };
    });
  }

  function score() {
    var r = 0, s = 0;
    Q.forEach(function (q, i) {
      var v = answers[i];
      if (q.s === "R") r += q.rev ? 5 - v : v;
      else s += q.rev ? 7 - v : v;
    });
    // Rosenberg 10 frases: 10–40 (mitad 25). SESS 3 frases: 3–18 (mitad 10,5).
    return { r: r, s: s, level: (r - 10) / 30, stab: (s - 3) / 15 };
  }

  function result() {
    var sc = score();
    var alta = sc.r > 25, estable = sc.stab > 0.5;
    var key = alta ? (estable ? "segura" : "fragil") : (estable ? "resignada" : "vulnerable");
    var d = QUAD[key];
    // Estable a la izquierda, inestable a la derecha; alta arriba, baja abajo (como en la presentación).
    var x = Math.min(95, Math.max(5, (1 - sc.stab) * 100));
    var y = Math.min(95, Math.max(5, (1 - sc.level) * 100));
    function cell(k) {
      return '<div class="cell c-' + k + (k === key ? " on" : "") + '">' + QUAD[k].name + '<small>' + QUAD[k].sub + '</small></div>';
    }
    app.innerHTML =
      '<p class="eyebrow">Tu resultado</p>' +
      '<h1>Tu autoestima es ' + d.name.toLowerCase() + '</h1>' +
      '<div class="matrix" role="img" aria-label="Matriz de autoestima. Tu punto está en la casilla ' + d.name + ' (' + d.sub.toLowerCase() + ').">' +
        '<div></div><div class="colhead"><span>Estable</span><span>Inestable</span></div>' +
        '<div class="rowhead"><span>Alta</span><span>Baja</span></div>' +
        '<div class="plane has-dot">' + cell("segura") + cell("fragil") + cell("resignada") + cell("vulnerable") +
          '<span class="dot" style="left:' + x + '%;top:' + y + '%"></span></div>' +
      '</div>' +
      '<div class="scores">' +
        '<div class="score"><b>' + sc.r + ' / 40</b><span>Nivel (Rosenberg)</span></div>' +
        '<div class="score"><b>' + sc.s + ' / 18</b><span>Estabilidad (SESS)</span></div>' +
      '</div>' +
      '<div class="result">' +
        '<h2>' + d.sub + '</h2>' +
        '<p>' + d.desc + '</p>' +
        '<p class="eyebrow">Cómo trabajarla</p>' +
        '<ul>' + d.acts.map(function (a) { return '<li>' + a + '</li>'; }).join("") + '</ul>' +
      '</div>' +
      '<p class="small muted">Cuanto más lejos del centro está tu punto, más marcado es el resultado. Es orientativo: tu autoestima puede cambiar y se puede trabajar.</p>';
  }

  function render() {
    if (step < 0) intro();
    else if (step < Q.length) question(step);
    else result();
    window.scrollTo(0, 0);
  }
  render();
})();
</script>
</body>
</html>
